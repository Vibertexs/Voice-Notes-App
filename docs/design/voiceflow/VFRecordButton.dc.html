<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ isIdle }}" hint-placeholder-val="{{ true }}">
<div onClick="{{ press }}" style="width:72px;height:72px;border-radius:36px;background:#FF2D55;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 0 6px rgba(255,45,85,.16),0 12px 36px rgba(255,45,85,.5);transition:transform .15s" style-active="transform:scale(.93)"><div style="width:24px;height:24px;border-radius:12px;background:#fff"></div></div>
</sc-if>
<sc-if value="{{ isRec }}" hint-placeholder-val="{{ false }}">
<div onClick="{{ press }}" style="width:80px;height:80px;border-radius:40px;background:rgba(255,45,85,.12);box-shadow:inset 0 0 0 3px #FF2D55,0 0 40px rgba(255,45,85,.25);display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;transition:transform .15s" style-active="transform:scale(.93)"><div style="width:7px;height:26px;border-radius:3px;background:#fff"></div><div style="width:7px;height:26px;border-radius:3px;background:#fff"></div></div>
</sc-if>
<sc-if value="{{ isPaused }}" hint-placeholder-val="{{ false }}">
<div onClick="{{ press }}" style="width:80px;height:80px;border-radius:40px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 3px #3A3A44;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s" style-active="transform:scale(.93)"><div style="width:30px;height:30px;border-radius:15px;background:#FF2D55;box-shadow:0 0 18px rgba(255,45,85,.6)"></div></div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:120,&quot;height&quot;:120},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;idle&quot;,&quot;recording&quot;,&quot;paused&quot;],&quot;default&quot;:&quot;idle&quot;,&quot;tsType&quot;:&quot;'idle'|'recording'|'paused'&quot;},&quot;onPress&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const s = this.props.state ?? 'idle';
    return { isIdle: s === 'idle', isRec: s === 'recording', isPaused: s === 'paused', press: (e) => { e.stopPropagation(); this.props.onPress && this.props.onPress(); } };
  }
}
</script>
</body>
</html>
