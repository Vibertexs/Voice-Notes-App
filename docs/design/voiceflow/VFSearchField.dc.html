<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;display=swap"></helmet>
<div style="display:flex;align-items:center;gap:10px;height:48px;padding:0 6px 0 16px;border-radius:24px;background:#1A1A20;box-shadow:inset 0 0 0 1px {{ ring }};font-family:Figtree,sans-serif;transition:box-shadow .2s">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7A7A84" stroke-width="2.4" stroke-linecap="round" style="flex:none"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
  <input ref="{{ inputRef }}" value="{{ val }}" onChange="{{ change }}" onFocus="{{ focus }}" onBlur="{{ blur }}" placeholder="{{ placeholder }}" style="flex:1;min-width:0;height:100%;background:transparent;border:0;outline:0;color:#F4F4F6;font-family:Figtree,sans-serif;font-size:16px;caret-color:#FF2D55">
  <sc-if value="{{ hasVal }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ clear }}" style="width:36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none" style-hover="background:rgba(255,255,255,.06)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A0A0AA" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:72},&quot;value&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;placeholder&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Search recordings &amp; transcripts&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;autoFocus&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(v: string) =&gt; void&quot;},&quot;onFocus&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { v: '', f: false };
  inputRef = React.createRef();
  componentDidMount() { if (this.props.autoFocus) setTimeout(() => this.inputRef.current && this.inputRef.current.focus({ preventScroll: true }), 60); }
  renderVals() {
    const p = this.props, ctl = p.value !== undefined, val = ctl ? p.value : this.state.v;
    const set = (v) => { if (!ctl) this.setState({ v }); p.onChange && p.onChange(v); };
    return {
      inputRef: this.inputRef, val, hasVal: !!val,
      placeholder: p.placeholder ?? 'Search recordings & transcripts',
      ring: this.state.f ? 'rgba(255,45,85,.55)' : 'rgba(255,255,255,.04)',
      change: (e) => set(e.target.value),
      clear: () => { set(''); this.inputRef.current && this.inputRef.current.focus({ preventScroll: true }); },
      focus: () => { this.setState({ f: true }); p.onFocus && p.onFocus(); },
      blur: () => this.setState({ f: false }),
    };
  }
}
</script>
</body>
</html>
