<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voice Notes</title>
    <style>
      :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; color: #16202a; background: #f3f7fb; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { width: min(42rem, calc(100% - 2rem)); background: white; border-radius: 1rem; padding: 2rem; box-shadow: 0 1rem 3rem #18344d20; }
      h1 { margin: 0; } p { line-height: 1.5; color: #526171; }
      .controls { display: flex; gap: .75rem; flex-wrap: wrap; margin: 1.5rem 0; }
      label { display: grid; gap: .35rem; font-weight: 700; margin: 1rem 0; }
      select { max-width: 23rem; border: 1px solid #aebdca; border-radius: .5rem; padding: .65rem; font: inherit; }
      button { border: 0; border-radius: .6rem; padding: .8rem 1rem; font: inherit; font-weight: 700; cursor: pointer; background: #0d6efd; color: white; }
      button.secondary { background: #e7edf4; color: #16202a; } button:disabled { cursor: wait; opacity: .55; }
      #status { min-height: 1.5rem; font-weight: 600; } #result { display: none; margin-top: 1.25rem; border-top: 1px solid #e7edf4; padding-top: 1rem; }
      #transcript { white-space: pre-wrap; font-size: 1.1rem; line-height: 1.65; } audio { width: 100%; margin-top: .5rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Voice Notes</h1>
      <p>Record a short note. It stays on this computer and is deleted from the server after transcription.</p>
      <label for="quality">Transcription quality
        <select id="quality">
          <option value="tiny.en">Fast — useful for quick checks, lowest accuracy</option>
          <option value="base.en" selected>Balanced — recommended starting point</option>
          <option value="small.en">High accuracy — slower first run and larger download</option>
        </select>
      </label>
      <div class="controls">
        <button id="record">Start recording</button>
        <button id="stop" class="secondary" disabled>Stop &amp; transcribe</button>
      </div>
      <div id="status" role="status" aria-live="polite">Ready to record.</div>
      <audio id="playback" controls hidden></audio>
      <section id="result"><h2>Transcript</h2><div id="transcript"></div></section>
    </main>
    <script>
      const recordButton = document.querySelector('#record');
      const stopButton = document.querySelector('#stop');
      const status = document.querySelector('#status');
      const playback = document.querySelector('#playback');
      const result = document.querySelector('#result');
      const transcript = document.querySelector('#transcript');
      const quality = document.querySelector('#quality');
      let recorder; let stream; let chunks = [];

      recordButton.addEventListener('click', async () => {
        try {
          stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          recorder = new MediaRecorder(stream);
          chunks = [];
          recorder.addEventListener('dataavailable', event => chunks.push(event.data));
          recorder.addEventListener('stop', uploadRecording, { once: true });
          recorder.start();
          status.textContent = 'Recording…';
          recordButton.disabled = true; stopButton.disabled = false; quality.disabled = true; result.style.display = 'none';
        } catch (error) {
          status.textContent = 'Microphone access was not granted. Please allow it and try again.';
        }
      });

      stopButton.addEventListener('click', () => {
        stopButton.disabled = true; status.textContent = 'Preparing recording…'; recorder.stop();
        stream.getTracks().forEach(track => track.stop());
      });

      async function uploadRecording() {
        const blob = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
        playback.src = URL.createObjectURL(blob); playback.hidden = false;
        const extension = recorder.mimeType.includes('mp4') ? 'mp4' : 'webm';
        const formData = new FormData(); formData.append('audio', blob, `voice-note.${extension}`);
        formData.append('model', quality.value);
        status.textContent = 'Transcribing…';
        try {
          const response = await fetch('/api/transcriptions', { method: 'POST', body: formData });
          const payload = await response.json();
          if (!response.ok) throw new Error(payload.detail || 'Transcription failed.');
          transcript.textContent = payload.text || 'No speech was detected.';
          result.style.display = 'block';
          status.textContent = `Done in ${payload.elapsed_seconds} seconds.`;
        } catch (error) {
          status.textContent = error.message;
        } finally {
          recordButton.disabled = false;
          quality.disabled = false;
        }
      }
    </script>
  </body>
</html>
