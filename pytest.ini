[pytest]
testpaths = tests
asyncio_mode = auto
# One event loop for the whole run: the app, its MongoDB client and every test
# share it. A client created on one loop cannot be used from another.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
markers =
    atlas_search: needs a real Atlas Search index; run with VOICEFLOW_TEST_ATLAS_SEARCH=1
